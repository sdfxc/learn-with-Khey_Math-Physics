<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ផ្ទាំងជូនពរបុណ្យភ្ជុំបិណ្ឌ - ទំហំក្រដាស A4</title>
    <style>
        /* General Page & Print Setup for A4 */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        body {
            font-family: 'Koulen', cursive, 'Noto Sans Khmer', sans-serif;
            background-color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ຈັດទំហំកាតជូនពរឱ្យត្រូវនឹងសមាមាត្រ និងទំហំស្ដង់ដារក្រដាស A4 (210mm x 297mm) */
        .card-container {
            width: 210mm;
            max-width: 210mm;
            min-height: 297mm;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            
            /* ដាក់ស៊ុមបែបខ្មែរ (Border) ព័ទ្ធជុំវិញកាត */
            border: 18px solid transparent;
            border-image: url('https://lh3.googleusercontent.com/d/1K2JU7lEHrm4O4WSuACe8tD7QJFNyUCvU') 30 stretch;
        }

        /* Top Section with New Full Background Image */
        .top-section {
            background-image: url('https://lh3.googleusercontent.com/d/1K2JU7lEHrm4O4WSuACe8tD7QJFNyUCvU');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            flex: 1;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ស្រទាប់μπាលពីលើ Background Image ដើម្បីឱ្យអក្សរច្បាស់ងាយអាន */
        .top-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.50);
            z-index: 0;
        }

        .top-section > * {
            position: relative;
            z-index: 1;
        }

        /* Top Header Image Container */
        .header-image-container {
            width: 80%;
            max-width: 400px;
            margin: 0 auto 15px auto;
        }

        .header-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Profile & Circular Frame Wrapper Container */
        .profile-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 10px auto 20px auto; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* User Profile Image Inside */
        .profile-container {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: #ffffff;
            border: 6px solid #d4af37;
            box-sizing: border-box;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Surround PNG Circular Frame with Temple & Text */
        .profile-frame {
            position: absolute;
            width: 280px;
            height: 280px;
            top: 0;
            left: 0;
            object-fit: contain;
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: darken;
            filter: contrast(130%) brightness(105%);
        }

       .message {
            font-size: 24px;
            color: #ffe684; /* ពណ៌លឿងមាសទន់ៗ ស្រស់ស្អាតស៊ីនឹងផ្ទៃខាងក្រោយ */
            line-height: 1.8;
            margin: 12px 0;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0.5, 1.5), 0 0 10px rgba(241, 196, 15, 0.4);
        }

        .dots {
            font-size: 24px;
            color: #34495e;
            letter-spacing: 8px;
            margin-top: 15px;
        }

        /* Print Settings */
        @media print {
            body {
                background: none;
            }
            .card-container {
                box-shadow: none;
                width: 100%;
                height: 100%;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Koulen&family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card-container">
        <div class="top-section">
            <!-- រូបភាពអក្សរដាក់នៅខាងលើគេ បង្អស់ (ពីលើ Profile និង Icon) -->
            <div class="header-image-container">
                <img src="https://lh3.googleusercontent.com/d/1W_iEzN42WuOUeWRYgASsdhpOP1xGFOTz" alt="អត្ថបទបុណ្យភ្ជុំបិណ្ឌ" class="header-image">
            </div>

            <!-- Profile & Circular Frame Wrapper Container -->
            <div class="profile-wrapper">
                <!-- រង្វង់ Profile -->
                <div class="profile-container">
                    <img src="https://lh3.googleusercontent.com/d/1e8okPPXFvJio2mC9yHZGCuwqmerGjl5R" alt="Profile Picture" class="profile-image">
                </div>

                <!-- ស៊ុម Icon ដែលត្រួតជាន់គ្នា -->
                <img src="https://lh3.googleusercontent.com/d/1qB0uP7UxauOUDdcBf-tLxkCHYKt90Fyb" alt="Profile Frame" class="profile-frame">
            </div>

            <!-- អត្ថបទជូនពរខាងក្រោម -->
            <div class="message">
                ក្នុងឱកាសពិធីបុណ្យភ្ជុំបិណ្ឌ <br>
                សូមជូនពរ អ្នកមានគុណទាំងពីរ មានសុខភាពល្អ អាយុវែង <br>
                ចៀសផុតពីជំងឺដង្កាត់រោគាព្យាធិទាំងឡាយ<br>
                ជាម្លប់ដ៏ត្រជាក់ដល់កូនចៅ។
            </div>
        </div>
    </div>

</body>
</html>
